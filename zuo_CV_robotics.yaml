  sections:
    experience:
      - company: Naver Corp
        position: Research Engineer
        start_date: 2021-05
        end_date: present
        location: South Korea
        highlights:
          - 'Built auto-bidding for display ads with offline RL (customized IQL) trained on large-scale logged interaction data, achieving a double-digit improvement in ads efficiency; presented at [Naver DAN 2025](https://youtu.be/iD4FTmDay6Y?t=294).'
          - 'Improved CVR and ROAS of NAVER Dynamic AD with advanced retrieval and RL models.'
          - 'Developed RL recommendation models for LINE Wallet, optimizing long-term user engagement.'
          - 'More: prototyped RLHF for user foundation models; integrated offline RL into Smart Message ranking; improved embedding and reranker models for Brand Chatbot; built the QueryLake ETL library and KPI reporting pipelines.'
      - company: Bosch Center for Artificial Intelligence
        position: Master Thesis
        start_date: 2017-05
        end_date: 2017-11
        location: Germany
        summary: 'Sample-efficient model-based policy search via Bayesian Neural Network dynamics models.'
        highlights:
          - 'Improved sample efficiency of model-based RL on continuous control from ~10 to ~6 trials.'
    education:
      - institution: University of Freiburg
        area: Computer Science
        degree: M.Sc.
        start_date: 2015
        end_date: 2019
        location: Freiburg, Germany
        summary: 'Focus: Machine Learning and Reinforcement Learning'
        highlights: []
      - institution: Linnaeus University
        area: Applied Mathematics
        degree: B.Sc.
        start_date: 2010
        end_date: 2015
        location: Vaxjo, Sweden
        summary: 'Minor: Computer Science'
        highlights: []
    projects:
      - name: '[Drift-VLA](https://zuoxingdong.github.io/drift-vla) — Direct One‑Step VLA Action Generation'
        start_date: 2026
        end_date: present
        summary: 'Research on VLA inference via one-step drifting, replacing iterative flow matching.'
        highlights:
          - 'Proposed **action-dimension drifting**.'
          - 'Faster decoding by 3–4×: 85.6 vs 259.8 ms/chunk for Pi0.5.'
          - 'Real LeKiwi task: 9/10 rollouts. On LIBERO, Pi0.5-Drift reaches 97.4% at 1 NFE against 96.9% for flow matching at 10 NFE.'
      - name: '[LeRobot CAD Studio](https://github.com/zuoxingdong/lerobot-cad-studio) (author)'
        start_date: 2026
        end_date: present
        summary: 'Browser studio to design 3D-printed parts for LeRobot robots with an AI coding agent, check them, and test them in MuJoCo. [Live demo](https://zuoxingdong.github.io/lerobot-cad-studio/).'
        highlights:
          - 'Agent workflow: turns a part request into a prompt and context pack; the returned STL becomes a new part option.'
          - 'Automatic checks: printability, fit and arm clearance, joint limits, camera view.'
          - 'In-browser MuJoCo (WASM) simulation of LeKiwi + PincOpen with a lab sample-transport task; exports STL and MJCF.'
      - name: '[Mobile Manipulation with LeKiwi and PincOpen](https://huggingface.co/blog/zuoxingdong/mobile-manipulation-lekiwi-pincopen) — HF Blog'
        start_date: 2026
        end_date: present
        highlights:
          - 'Integrated the PincOpen gripper into LeKiwi: published a detailed build tutorial, and diagnosed an arm-extension voltage-drop failure.'
      - name: '[LeRobot Worldwide Hackathon 2025](https://www.youtube.com/watch?v=HgN0qIFSd8I&t=117s) — Hugging Face'
        start_date: 2025
        end_date: 2025
        summary: 'Led a 5-person team over 2 days to complete a language-instructed manipulation task using SmolVLA on real hardware.'
        highlights:
          - 'Owned team coordination, task decomposition.'
      - name: '[lekiwi-tui](https://github.com/zuoxingdong/lekiwi-tui) (author)'
        start_date: 2026
        end_date: present
        summary: 'Terminal control center for the LeKiwi robot workflow, built on LeRobot. Also [lerobokinson](https://github.com/zuoxingdong/lerobokinson) (2025), a GUI for PD gain tuning of Dynamixel servos.'
    publications:
      - title: 'Constrained Auto-Bidding via Generative Response Modeling'
        authors:
